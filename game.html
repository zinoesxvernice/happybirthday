<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>happy birthday baby!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-pink: #FF9FCB;
    --dot-white: #FFFCF5;
    --title-pink: #FFB3DA;
    --stroke-cream: #FFF6E3;
    --shadow-deep: #D9448F;
    --accent-hot: #FF5FA8;
    --miss-red: #E23E57;
    --good-green: #3ED598;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  body {
    background-color: var(--bg-pink);
    background-image:
      radial-gradient(var(--dot-white) 3.5px, transparent 3.6px),
      radial-gradient(var(--dot-white) 3.5px, transparent 3.6px);
    background-size: 60px 60px;
    background-position: 0 0, 30px 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'VT323', monospace;
    position: relative;
  }

  .crt-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 1px,
      transparent 2px, transparent 4px
    );
    mix-blend-mode: overlay;
    z-index: 10;
  }

  .arcade-text {
    font-family: 'Press Start 2P', monospace;
    color: var(--title-pink);
    -webkit-text-stroke: 2px var(--stroke-cream);
    paint-order: stroke fill;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: min(560px, 92vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(10px, 2vw, 14px);
    color: var(--stroke-cream);
    -webkit-text-stroke: 1.5px var(--shadow-deep);
  }

  .lives span { margin-left: 4px; opacity: 0.35; }
  .lives span.on { opacity: 1; }

  .recipe-name {
    font-size: clamp(14px, 3.2vw, 20px);
    text-align: center;
  }

  .instruction {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(15px, 3.6vw, 24px);
    color: var(--stroke-cream);
    -webkit-text-stroke: 1.5px var(--shadow-deep);
    letter-spacing: 1px;
    text-align: center;
  }

  .bar-row {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .bar-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--shadow-deep);
  }

  .bar-track {
    width: 100%;
    height: 14px;
    background: rgba(255,255,255,0.45);
    border: 3px solid var(--stroke-cream);
    border-radius: 8px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 100%;
    transform-origin: left;
  }
  #timeFill { background: var(--stroke-cream); }
  #progressFill { background: var(--good-green); width: 0%; transition: width 0.08s linear; }

  .gesture-stage {
    width: 100%;
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  /* circle gesture */
  .circle-zone {
    position: relative;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: var(--accent-hot);
    border: 5px solid var(--stroke-cream);
    box-shadow: 0 6px 0 var(--shadow-deep);
    cursor: grab;
  }
  .circle-zone .dot {
    position: absolute;
    top: 8px;
    left: 50%;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    background: var(--stroke-cream);
    border: 3px solid var(--shadow-deep);
    border-radius: 50%;
    transform-origin: 8px 77px;
  }

  /* frost-swirl gesture */
  .frost-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: var(--accent-hot);
    border: 6px solid var(--stroke-cream);
    box-shadow: 0 6px 0 var(--shadow-deep);
    touch-action: none;
    cursor: grab;
  }
  .frost-wrap svg {
    position: absolute;
    top: 17px; left: 17px;
    width: 156px; height: 156px;
  }
  .frost-knife {
    position: absolute;
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
    pointer-events: none;
    background: var(--stroke-cream);
    border: 3px solid var(--shadow-deep);
    border-radius: 50%;
    z-index: 2;
  }

  /* mix-bowl gesture */
  .mix-bowl {
    position: relative;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: var(--accent-hot);
    border: 6px solid var(--stroke-cream);
    box-shadow: 0 6px 0 var(--shadow-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  .mix-batter {
    position: relative;
    width: 156px;
    height: 156px;
    border-radius: 50%;
    background: #F4E1B8;
    border: 4px solid #C9932A;
    overflow: hidden;
  }
  .lump {
    position: absolute;
    width: 20px;
    height: 20px;
    margin-left: -10px;
    margin-top: -10px;
    border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
    background: #C9932A;
    border: 2px solid #8B5E34;
    transition: transform 0.25s ease-in, opacity 0.25s ease-in;
  }
  .lump.cleared {
    transform: scale(0);
    opacity: 0;
  }
  .spoon {
    position: absolute;
    width: 26px;
    height: 26px;
    margin-left: -13px;
    margin-top: -13px;
    pointer-events: none;
    z-index: 2;
  }
  .spoon .head {
    position: absolute;
    left: 3px;
    top: 3px;
    width: 20px;
    height: 20px;
    background: var(--stroke-cream);
    border: 3px solid var(--shadow-deep);
    border-radius: 50%;
  }
  .spoon .handle {
    position: absolute;
    left: 11px;
    top: -16px;
    width: 5px;
    height: 20px;
    background: var(--stroke-cream);
    border: 2px solid var(--shadow-deep);
    border-radius: 3px;
  }


  /* pour-balance gesture: bowl tips into a moving tin */
  .pour-scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 16px;
    padding: 6px 0;
  }
  .pour-hint {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--shadow-deep);
    text-align: center;
  }
  .pour-fixed-bowl {
    position: relative;
    width: 84px;
    height: 54px;
    background: var(--accent-hot);
    border: 5px solid var(--stroke-cream);
    border-radius: 8px 8px 30px 30px;
    box-shadow: 0 6px 0 var(--shadow-deep);
    transform-origin: 85% 100%;
    transition: transform 0.12s ease-out;
    cursor: grab;
    touch-action: none;
  }
  .pour-fixed-bowl.tipping {
    transform: rotate(-32deg);
  }
  .pour-fixed-bowl::after {
    content: "";
    position: absolute;
    right: -6px;
    bottom: 6px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-top: 8px solid var(--stroke-cream);
  }
  .pour-stream {
    position: absolute;
    width: 7px;
    background: #F4E1B8;
    border-left: 2px solid #C9932A;
    border-right: 2px solid #C9932A;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .pour-stream.active { opacity: 1; }
  .pour-rail {
    position: relative;
    width: 100%;
    height: 40px;
  }
  .pour-rail::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    bottom: 4px;
    height: 4px;
    background: var(--shadow-deep);
    opacity: 0.4;
    border-radius: 2px;
  }
  .pour-tin {
    position: absolute;
    bottom: 0;
    width: 60px;
    height: 32px;
    margin-left: -30px;
    background: #C9C9C9;
    border: 4px solid #8A8A8A;
    border-radius: 6px 6px 14px 14px;
    box-shadow: 0 4px 0 #8A8A8A;
  }
  .pour-tin .fill {
    position: absolute;
    left: 4px; right: 4px; bottom: 3px;
    height: 0%;
    background: #F4E1B8;
    border-radius: 2px 2px 8px 8px;
    transition: height 0.1s linear;
  }
  .pour-tin.aligned {
    box-shadow: 0 4px 0 #8A8A8A, 0 0 0 4px rgba(62,213,152,0.6);
  }

  .hold-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--stroke-cream);
    -webkit-text-stroke: 1.5px var(--shadow-deep);
    background: var(--accent-hot);
    border: 5px solid var(--stroke-cream);
    border-radius: 16px;
    box-shadow: 0 6px 0 var(--shadow-deep);
    width: 170px;
    height: 120px;
    cursor: pointer;
  }
  .hold-btn:active, .hold-btn.active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 var(--shadow-deep);
    background: var(--good-green);
  }

  /* bake-timing gesture */
  .bake-scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .bake-hint {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--shadow-deep);
    text-align: center;
  }

  .oven-wrap {
    position: relative;
    width: 190px;
  }

  .heat-glow {
    position: absolute;
    left: 50%;
    bottom: -14px;
    width: 150px;
    height: 40px;
    margin-left: -75px;
    background: radial-gradient(ellipse at center, rgba(255,160,60,0.55) 0%, rgba(255,160,60,0) 70%);
    animation: glow-pulse 1.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .steam {
    position: absolute;
    top: -18px;
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    animation: steam-rise 2.2s ease-in infinite;
    opacity: 0;
  }
  .steam.s1 { left: 30px; animation-delay: 0s; }
  .steam.s2 { left: 90px; animation-delay: 0.7s; }
  .steam.s3 { left: 145px; animation-delay: 1.4s; }
  @keyframes steam-rise {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    30% { opacity: 0.8; }
    100% { transform: translateY(-26px) scale(1.1); opacity: 0; }
  }

  .oven-body {
    position: relative;
    width: 190px;
    background: #6B4630;
    border: 6px solid var(--stroke-cream);
    border-radius: 16px 16px 10px 10px;
    box-shadow: 0 8px 0 #4A2F1D;
    padding: 10px 12px 14px;
    z-index: 1;
  }

  .oven-panel {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .oven-knob {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--stroke-cream);
    border: 3px solid #4A2F1D;
  }
  .oven-knob::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 6px;
    background: #4A2F1D;
  }

  .oven-window {
    width: 100%;
    height: 92px;
    background: #2A1810;
    border: 5px solid #4A2F1D;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .oven-cake {
    width: 60px;
    height: 44px;
    border-radius: 50% 50% 40% 40%;
    background: #FFF3D6;
    border: 3px solid #C9932A;
    transition: background-color 0.15s linear;
  }

  .oven-handle {
    position: absolute;
    bottom: 4px;
    left: 50%;
    width: 70px;
    height: 8px;
    margin-left: -35px;
    background: var(--stroke-cream);
    border: 2px solid #4A2F1D;
    border-radius: 4px;
  }

  .oven-legs {
    display: flex;
    justify-content: space-between;
    width: 150px;
    margin: 0 auto;
  }
  .oven-leg {
    width: 14px;
    height: 10px;
    background: #4A2F1D;
    border-radius: 0 0 4px 4px;
  }

  .bake-gauge {
    position: relative;
    width: 230px;
    height: 30px;
    border: 5px solid var(--stroke-cream);
    border-radius: 10px;
    box-shadow: 0 5px 0 var(--shadow-deep);
    background: linear-gradient(
      to right,
      #FFF3D6 0%, #FFE9A8 22%, #F4C24C 45%, #D98A2E 62%, #A8531F 80%, #5C2A14 100%
    );
    overflow: hidden;
  }
  .bake-zone {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(255,255,255,0.0);
    border-left: 3px dashed var(--good-green);
    border-right: 3px dashed var(--good-green);
  }
  .bake-needle {
    position: absolute;
    top: -4px; bottom: -4px;
    width: 6px;
    margin-left: -3px;
    background: var(--stroke-cream);
    border: 2px solid var(--shadow-deep);
    border-radius: 4px;
  }
  .bake-hits {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--shadow-deep);
  }
  .bake-tap-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--stroke-cream);
    -webkit-text-stroke: 1.5px var(--shadow-deep);
    background: var(--accent-hot);
    border: 5px solid var(--stroke-cream);
    border-radius: 14px;
    box-shadow: 0 6px 0 var(--shadow-deep);
    width: 150px;
    height: 56px;
    cursor: pointer;
  }
  .bake-tap-btn.hit-good { background: var(--good-green); }
  .bake-tap-btn.hit-bad { background: var(--miss-red); }
  .bake-tap-btn.pulse { animation: tap-pulse 0.12s ease-out; }

  /* sprinkle-shake gesture */
  .sprinkle-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: var(--accent-hot);
    border: 6px solid var(--stroke-cream);
    box-shadow: 0 6px 0 var(--shadow-deep);
    touch-action: none;
    cursor: grab;
    overflow: hidden;
  }
  .sprinkle-cake {
    position: absolute;
    top: 17px; left: 17px;
    width: 156px; height: 156px;
    border-radius: 50%;
    background: #FFD9EC;
    border: 4px solid #E88FC0;
    overflow: hidden;
  }
  .sprinkle-dot {
    position: absolute;
    width: 5px;
    height: 11px;
    margin-left: -2.5px;
    margin-top: -5.5px;
    border-radius: 2px;
    transform-origin: center;
    animation: sprinkle-drop 0.15s ease-out;
  }
  @keyframes sprinkle-drop {
    0% { transform: scale(0) rotate(var(--rot)); }
    100% { transform: scale(1) rotate(var(--rot)); }
  }
  .shaker {
    position: absolute;
    width: 26px;
    height: 34px;
    margin-left: -13px;
    margin-top: -30px;
    pointer-events: none;
    z-index: 3;
    background: var(--stroke-cream);
    border: 3px solid var(--shadow-deep);
    border-radius: 6px 6px 10px 10px;
    transition: transform 0.06s ease-out;
  }
  .shaker::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 6px;
    width: 11px;
    height: 8px;
    background: var(--shadow-deep);
    border-radius: 3px 3px 0 0;
  }
  .shaker.wiggle-a { transform: rotate(-18deg); }
  .shaker.wiggle-b { transform: rotate(18deg); }

  /* tap gesture */
  .tap-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--stroke-cream);
    -webkit-text-stroke: 1.5px var(--shadow-deep);
    background: var(--accent-hot);
    border: 5px solid var(--stroke-cream);
    border-radius: 50%;
    box-shadow: 0 6px 0 var(--shadow-deep);
    width: 150px;
    height: 150px;
    cursor: pointer;
  }
  .tap-btn.pulse { animation: tap-pulse 0.12s ease-out; }
  @keyframes tap-pulse {
    0% { transform: scale(0.88); }
    100% { transform: scale(1); }
  }

  .feedback {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(11px, 2.4vw, 16px);
    color: var(--stroke-cream);
    -webkit-text-stroke: 1.5px var(--shadow-deep);
    min-height: 1.4em;
    text-align: center;
  }

  .overlay-screen {
    position: absolute; inset: 0;
    background: rgba(217,68,143,0.92);
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    text-align: center;
    padding: 24px;
  }
  .overlay-screen.show { display: flex; }

  .overlay-title {
    font-size: clamp(22px, 5vw, 34px);
    color: var(--stroke-cream);
    -webkit-text-stroke: 2px var(--accent-hot);
  }
  .overlay-sub { font-family: 'VT323', monospace; color: var(--stroke-cream); font-size: 22px; }
  .overlay-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--stroke-cream);
    -webkit-text-stroke: 1.5px var(--shadow-deep);
    background: var(--accent-hot);
    border: 4px solid var(--stroke-cream);
    border-radius: 10px;
    box-shadow: 0 6px 0 var(--shadow-deep);
    padding: 14px 24px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .overlay-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow-deep); }

  @keyframes shake-anim {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .shake { animation: shake-anim 0.25s linear; }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="hud">
      <div class="lives" id="lives">
        <span class="on">♥</span><span class="on">♥</span><span class="on">♥</span>
      </div>
      <div id="score">SCORE 0</div>
    </div>

    <div class="recipe-name arcade-text" id="recipeName">CUPCAKE ROUND 1</div>
    <div class="instruction" id="instruction">GET READY...</div>

    <div class="bar-row">
      <div id="timeRow">
        <div class="bar-label">TIME</div>
        <div class="bar-track"><div class="bar-fill" id="timeFill"></div></div>
      </div>
      <div class="bar-label">PROGRESS</div>
      <div class="bar-track"><div class="bar-fill" id="progressFill"></div></div>
    </div>

    <div class="gesture-stage" id="gestureStage"></div>

    <div class="feedback" id="feedback">&nbsp;</div>
  </div>

  <div class="overlay-screen" id="roundCompleteScreen">
    <div class="overlay-title arcade-text">CAKE'S DONE!</div>
    <div class="overlay-sub" id="roundCompleteScore">Score so far: 0</div>
    <button class="overlay-btn" id="nextRoundBtn">NEXT RECIPE ▶</button>
    <a class="overlay-btn" href="cake.html" style="text-decoration:none;">SERVE THE CAKE ▶</a>
  </div>

  <div class="overlay-screen" id="gameOverScreen">
    <div class="overlay-title arcade-text">OVEN'S OFF!</div>
    <div class="overlay-sub" id="finalScore">Final score: 0</div>
    <button class="overlay-btn" id="retryBtn">TRY AGAIN</button>
    <a class="overlay-btn" href="index.html" style="text-decoration:none;">TITLE SCREEN</a>
  </div>

  <div class="crt-overlay"></div>

<script>
  const GESTURE_MAP = {
    MIX: "mixBowl",
    FROST: "frostSwirl",
    POUR: "pourBalance",
    BAKE: "bakeTiming",
    SPRINKLE: "sprinkleShake",
    DECORATE: "tap",
  };

  const INSTRUCTION_TEXT = {
    MIX: "STIR OUT THE LUMPS!",
    FROST: "TRACE THE SWIRL!",
    POUR: "KEEP THE STREAM STEADY!",
    BAKE: "TAP WHEN GOLDEN!",
    SPRINKLE: "SHAKE IT ALL OVER!",
    DECORATE: "TAP TO DECORATE!",
  };

  const RECIPE_NAMES = ["CUPCAKE", "COOKIE", "BROWNIE", "PIE", "DONUT"];
  const ACTIONS = Object.keys(GESTURE_MAP);

  let round = 1;
  let score = 0;
  let lives = 3;
  let combo = 0;
  let sequence = [];
  let stepIndex = 0;
  let stepTimeMs = 3200;
  let timeTimerId = null;

  // gesture tracking state
  let progress = 0;
  let requiredValue = 100;
  let dragging = false;
  let lastAngle = null;
  let totalRotation = 0;
  let lastX = null;
  let lastDir = 0;
  let shakeCount = 0;
  let holdStart = null;
  let holdActive = false;
  let tapCount = 0;
  let lumps = [];
  let lumpsCleared = 0;
  let stepResolved = false;

  const instructionEl = document.getElementById("instruction");
  const timeFillEl = document.getElementById("timeFill");
  const progressFillEl = document.getElementById("progressFill");
  const scoreEl = document.getElementById("score");
  const livesEl = document.getElementById("lives");
  const feedbackEl = document.getElementById("feedback");
  const recipeNameEl = document.getElementById("recipeName");
  const stageEl = document.getElementById("stage");
  const gestureStageEl = document.getElementById("gestureStage");

  function buildSequence() {
    const length = 5 + Math.min(round, 4);
    sequence = [];
    let pourUsed = false;
    for (let i = 0; i < length; i++) {
      const pool = pourUsed ? ACTIONS.filter(a => a !== "POUR") : ACTIONS;
      const choice = pool[Math.floor(Math.random() * pool.length)];
      if (choice === "POUR") pourUsed = true;
      sequence.push(choice);
    }
  }

  function startRound() {
    buildSequence();
    stepIndex = 0;
    stepTimeMs = Math.max(2200, 3200 - (round - 1) * 150);
    recipeNameEl.textContent =
      RECIPE_NAMES[(round - 1) % RECIPE_NAMES.length] + " ROUND " + round;
    feedbackEl.textContent = "\u00A0";
    showStep();
  }

  function setProgress(pct) {
    progress = Math.max(0, Math.min(100, pct));
    progressFillEl.style.width = progress + "%";
  }

  function showStep() {
    if (stepIndex >= sequence.length) {
      roundComplete();
      return;
    }
    stepResolved = false;
    const action = sequence[stepIndex];
    const gesture = GESTURE_MAP[action];
    instructionEl.textContent = INSTRUCTION_TEXT[action];
    setProgress(0);
    resetGestureState();
    renderGestureStage(gesture, action, round);

    clearTimeout(timeTimerId);
    document.getElementById("timeRow").style.display = "none";
  }

  function resetGestureState() {
    dragging = false;
    lastAngle = null;
    totalRotation = 0;
    lastX = null;
    lastDir = 0;
    shakeCount = 0;
    holdStart = null;
    holdActive = false;
    tapCount = 0;
    lumps = [];
    lumpsCleared = 0;
  }

  function runTimeBar() {
    clearTimeout(timeTimerId);
    timeFillEl.style.transition = "none";
    timeFillEl.style.width = "100%";
    void timeFillEl.offsetWidth;
    timeFillEl.style.transition = `width ${stepTimeMs}ms linear`;
    timeFillEl.style.width = "0%";
    timeTimerId = setTimeout(() => resolveStep(false, true), stepTimeMs);
  }

  function renderGestureStage(gesture, action, difficultyRound) {
    gestureStageEl.innerHTML = "";

    if (gesture === "mixBowl") {
      requiredValue = 7 + Math.min(difficultyRound, 5);
      const bowl = document.createElement("div");
      bowl.className = "mix-bowl";
      const batter = document.createElement("div");
      batter.className = "mix-batter";
      const spoon = document.createElement("div");
      spoon.className = "spoon";
      spoon.innerHTML = '<div class="handle"></div><div class="head"></div>';
      bowl.appendChild(batter);
      batter.appendChild(spoon);
      gestureStageEl.appendChild(bowl);

      // scatter lumps at random points inside the batter circle
      const radius = 66;
      lumps = [];
      for (let i = 0; i < requiredValue; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (radius - 14);
        const lx = 78 + Math.cos(angle) * dist;
        const ly = 78 + Math.sin(angle) * dist;
        const el = document.createElement("div");
        el.className = "lump";
        el.style.left = lx + "px";
        el.style.top = ly + "px";
        batter.appendChild(el);
        lumps.push({ el, x: lx, y: ly, cleared: false });
      }
      spoon.style.left = "78px";
      spoon.style.top = "78px";

      const getLocalPoint = (e) => {
        const point = e.touches ? e.touches[0] : e;
        const r = batter.getBoundingClientRect();
        return { x: point.clientX - r.left, y: point.clientY - r.top };
      };

      const onDown = (e) => { dragging = true; moveSpoon(e); };
      const onMove = (e) => { if (dragging) moveSpoon(e); };
      const onUp = () => { dragging = false; };

      function moveSpoon(e) {
        if (stepResolved) return;
        const p = getLocalPoint(e);
        spoon.style.left = p.x + "px";
        spoon.style.top = p.y + "px";
        lumps.forEach(l => {
          if (l.cleared) return;
          const dx = p.x - l.x, dy = p.y - l.y;
          if (Math.sqrt(dx * dx + dy * dy) < 22) {
            l.cleared = true;
            l.el.classList.add("cleared");
            lumpsCleared++;
            setProgress((lumpsCleared / requiredValue) * 100);
            if (lumpsCleared >= requiredValue) resolveStep(true, false);
          }
        });
      }

      bowl.addEventListener("pointerdown", onDown);
      bowl.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      bowl._cleanup = () => window.removeEventListener("pointerup", onUp);

    } else if (gesture === "frostSwirl") {
      const checkpointCount = 6 + Math.min(Math.floor(difficultyRound / 2), 4);
      requiredValue = checkpointCount;
      let nextIndex = 0;

      const wrap = document.createElement("div");
      wrap.className = "frost-wrap";
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 156 156");

      const cake = document.createElementNS(svgNS, "circle");
      cake.setAttribute("cx", "78"); cake.setAttribute("cy", "78"); cake.setAttribute("r", "72");
      cake.setAttribute("fill", "#FFE9CC");
      cake.setAttribute("stroke", "#C9932A");
      cake.setAttribute("stroke-width", "3");
      svg.appendChild(cake);

      // build a dense spiral point list, center outward
      const cx = 78, cy = 78, turns = 2.2, n = 72;
      const points = [];
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const angle = t * Math.PI * 2 * turns;
        const radius = 12 + t * 54;
        points.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius });
      }
      const pointsToPath = (pts) =>
        pts.length ? "M " + pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" L ") : "";

      const guide = document.createElementNS(svgNS, "path");
      guide.setAttribute("d", pointsToPath(points));
      guide.setAttribute("fill", "none");
      guide.setAttribute("stroke", "var(--stroke-cream)");
      guide.setAttribute("stroke-width", "3");
      guide.setAttribute("stroke-dasharray", "3 5");
      guide.setAttribute("opacity", "0.7");
      svg.appendChild(guide);

      const trail = document.createElementNS(svgNS, "path");
      trail.setAttribute("fill", "none");
      trail.setAttribute("stroke", "var(--title-pink)");
      trail.setAttribute("stroke-width", "9");
      trail.setAttribute("stroke-linecap", "round");
      trail.setAttribute("stroke-linejoin", "round");
      svg.appendChild(trail);

      // checkpoints evenly spaced along the dense point list (skip the very first point)
      const step = Math.floor((n - 1) / checkpointCount);
      const checkpoints = [];
      for (let c = 1; c <= checkpointCount; c++) {
        const idx = Math.min(n - 1, c * step);
        const p = points[idx];
        const circle = document.createElementNS(svgNS, "circle");
        circle.setAttribute("cx", p.x); circle.setAttribute("cy", p.y); circle.setAttribute("r", "7");
        circle.setAttribute("fill", "var(--stroke-cream)");
        circle.setAttribute("stroke", "var(--shadow-deep)");
        circle.setAttribute("stroke-width", "2.5");
        svg.appendChild(circle);
        checkpoints.push({ x: p.x, y: p.y, pointIndex: idx, el: circle });
      }

      wrap.appendChild(svg);
      const knife = document.createElement("div");
      knife.className = "frost-knife";
      wrap.appendChild(knife);
      gestureStageEl.appendChild(wrap);

      let lastCapturedPointIndex = 0;

      const getLocalPoint = (e) => {
        const point = e.touches ? e.touches[0] : e;
        const r = svg.getBoundingClientRect();
        const scaleX = 156 / r.width, scaleY = 156 / r.height;
        return { x: (point.clientX - r.left) * scaleX, y: (point.clientY - r.top) * scaleY };
      };

      const onDown = (e) => { dragging = true; moveKnife(e); };
      const onMove = (e) => { if (dragging) moveKnife(e); };
      const onUp = () => { dragging = false; };

      function moveKnife(e) {
        if (stepResolved) return;
        const p = getLocalPoint(e);
        knife.style.left = (17 + p.x) + "px";
        knife.style.top = (17 + p.y) + "px";

        if (nextIndex >= checkpoints.length) return;
        const target = checkpoints[nextIndex];
        const dx = p.x - target.x, dy = p.y - target.y;
        if (Math.sqrt(dx * dx + dy * dy) < 14) {
          target.el.setAttribute("fill", "var(--title-pink)");
          trail.setAttribute("d", pointsToPath(points.slice(lastCapturedPointIndex, target.pointIndex + 1)));
          lastCapturedPointIndex = target.pointIndex;
          nextIndex++;
          setProgress((nextIndex / checkpointCount) * 100);
          if (nextIndex >= checkpointCount) resolveStep(true, false);
        }
      }

      wrap.addEventListener("pointerdown", onDown);
      wrap.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      wrap._cleanup = () => window.removeEventListener("pointerup", onUp);

    } else if (gesture === "circle") {
      requiredValue = 2 * Math.PI * (1.6 + Math.min(difficultyRound * 0.2, 1.4));
      const zone = document.createElement("div");
      zone.className = "circle-zone";
      const dot = document.createElement("div");
      dot.className = "dot";
      zone.appendChild(dot);
      gestureStageEl.appendChild(zone);

      const center = () => {
        const r = zone.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      };

      const onDown = (e) => { dragging = true; lastAngle = null; };
      const onMove = (e) => {
        if (!dragging || stepResolved) return;
        const point = e.touches ? e.touches[0] : e;
        const c = center();
        const angle = Math.atan2(point.clientY - c.y, point.clientX - c.x);
        dot.style.transform = `rotate(${angle + Math.PI / 2}rad)`;
        if (lastAngle !== null) {
          let delta = angle - lastAngle;
          if (delta > Math.PI) delta -= 2 * Math.PI;
          if (delta < -Math.PI) delta += 2 * Math.PI;
          totalRotation += Math.abs(delta);
          setProgress((totalRotation / requiredValue) * 100);
          if (totalRotation >= requiredValue) resolveStep(true, false);
        }
        lastAngle = angle;
      };
      const onUp = () => { dragging = false; };

      zone.addEventListener("pointerdown", onDown);
      zone.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      zone._cleanup = () => window.removeEventListener("pointerup", onUp);

    } else if (gesture === "pourBalance") {
      requiredValue = 1300 + Math.min(difficultyRound * 80, 700);
      const scene = document.createElement("div");
      scene.className = "pour-scene";

      const hint = document.createElement("div");
      hint.className = "pour-hint";
      hint.textContent = "HOLD THE BOWL WHEN THE TIN IS UNDERNEATH!";

      const bowl = document.createElement("div");
      bowl.className = "pour-fixed-bowl";

      const stream = document.createElement("div");
      stream.className = "pour-stream";

      const rail = document.createElement("div");
      rail.className = "pour-rail";
      const tin = document.createElement("div");
      tin.className = "pour-tin";
      const fill = document.createElement("div");
      fill.className = "fill";
      tin.appendChild(fill);
      rail.appendChild(tin);

      scene.appendChild(hint);
      scene.appendChild(bowl);
      scene.appendChild(stream);
      scene.appendChild(rail);
      gestureStageEl.appendChild(scene);

      const railWidth = () => rail.getBoundingClientRect().width || 220;

      function measure() {
        const sceneRect = scene.getBoundingClientRect();
        const bowlRect = bowl.getBoundingClientRect();
        const railRect = rail.getBoundingClientRect();
        const spoutX = bowlRect.right - sceneRect.left - 10;
        const streamTop = bowlRect.bottom - sceneRect.top - 2;
        const streamMaxHeight = Math.max(0, railRect.top - sceneRect.top - streamTop);
        return { spoutX, streamTop, streamMaxHeight };
      }

      let { spoutX, streamTop, streamMaxHeight } = measure();
      stream.style.left = (spoutX - 3.5) + "px";
      stream.style.top = streamTop + "px";
      stream.style.height = "0px";

      let phase = Math.random() * Math.PI * 2;
      const speed = 0.0016 + Math.min(difficultyRound * 0.00018, 0.0012);
      const tolerance = Math.max(16, 30 - difficultyRound * 1.5);
      let lastTs = null;
      let pourTime = 0;
      let localRaf = null;
      let tinX = railWidth() / 2;

      const onDown = () => {
        holdActive = true;
        bowl.classList.add("tipping");
      };
      const onUp = () => {
        holdActive = false;
        bowl.classList.remove("tipping");
        stream.classList.remove("active");
        stream.style.height = "0px";
      };

      function frame(ts) {
        if (stepResolved) return;
        if (lastTs === null) lastTs = ts;
        const dt = ts - lastTs;
        lastTs = ts;

        const w = railWidth();
        const half = (w - 60) / 2; // tin width 60
        phase += speed * dt;
        tinX = half + half * Math.sin(phase) + 30; // center x of tin
        tin.style.left = tinX + "px";

        const aligned = Math.abs(tinX - spoutX) <= tolerance;
        tin.classList.toggle("aligned", aligned && holdActive);

        if (holdActive) {
          stream.classList.add("active");
          stream.style.height = streamMaxHeight + "px";
          if (aligned) {
            pourTime += dt;
            setProgress((pourTime / requiredValue) * 100);
            fill.style.height = Math.min(100, (pourTime / requiredValue) * 100) + "%";
            if (pourTime >= requiredValue) { resolveStep(true, false); return; }
          } else {
            pourTime = Math.max(0, pourTime - dt * 0.4);
            setProgress((pourTime / requiredValue) * 100);
            fill.style.height = Math.min(100, (pourTime / requiredValue) * 100) + "%";
          }
        } else {
          stream.classList.remove("active");
          stream.style.height = "0px";
        }

        localRaf = requestAnimationFrame(frame);
      }

      bowl.addEventListener("pointerdown", onDown);
      window.addEventListener("pointerup", onUp);
      const onResize = () => {
        ({ spoutX, streamTop, streamMaxHeight } = measure());
        stream.style.left = (spoutX - 3.5) + "px";
        stream.style.top = streamTop + "px";
      };
      window.addEventListener("resize", onResize);
      localRaf = requestAnimationFrame(frame);
      bowl._cleanup = () => {
        cancelAnimationFrame(localRaf);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("resize", onResize);
      };

    } else if (gesture === "hold") {
      requiredValue = 1300 + Math.min(difficultyRound * 80, 700);
      const btn = document.createElement("button");
      btn.className = "hold-btn";
      btn.textContent = "HOLD";
      gestureStageEl.appendChild(btn);

      const onDown = () => {
        holdActive = true;
        holdStart = Date.now();
        btn.classList.add("active");
        tickHold();
      };
      const onUp = () => {
        holdActive = false;
        btn.classList.remove("active");
      };
      function tickHold() {
        if (!holdActive || stepResolved) return;
        const elapsed = Date.now() - holdStart;
        setProgress((elapsed / requiredValue) * 100);
        if (elapsed >= requiredValue) { resolveStep(true, false); return; }
        requestAnimationFrame(tickHold);
      }
      btn.addEventListener("pointerdown", onDown);
      btn.addEventListener("pointerup", onUp);
      btn.addEventListener("pointerleave", onUp);

    } else if (gesture === "bakeTiming") {
      const hitsNeeded = 3 + Math.min(Math.floor(difficultyRound / 2), 3);
      requiredValue = hitsNeeded;
      let hits = 0;

      const scene = document.createElement("div");
      scene.className = "bake-scene";
      const hint = document.createElement("div");
      hint.className = "bake-hint";
      hint.textContent = "TAP PEEK! WHEN THE CAKE LOOKS GOLDEN";

      const ovenWrap = document.createElement("div");
      ovenWrap.className = "oven-wrap";
      ovenWrap.innerHTML = `
        <div class="heat-glow"></div>
        <div class="steam s1">~</div>
        <div class="steam s2">~</div>
        <div class="steam s3">~</div>
        <div class="oven-body">
          <div class="oven-panel">
            <div class="oven-knob"></div>
            <div class="oven-knob"></div>
            <div class="oven-knob"></div>
          </div>
          <div class="oven-window"><div class="oven-cake"></div></div>
          <div class="oven-handle"></div>
        </div>
        <div class="oven-legs"><div class="oven-leg"></div><div class="oven-leg"></div></div>
      `;
      const cakeEl = ovenWrap.querySelector(".oven-cake");

      const gauge = document.createElement("div");
      gauge.className = "bake-gauge";
      const zone = document.createElement("div");
      zone.className = "bake-zone";
      const needle = document.createElement("div");
      needle.className = "bake-needle";
      gauge.appendChild(zone);
      gauge.appendChild(needle);
      const hitsLabel = document.createElement("div");
      hitsLabel.className = "bake-hits";
      hitsLabel.textContent = "GOOD BAKES: 0 / " + hitsNeeded;
      const btn = document.createElement("button");
      btn.className = "bake-tap-btn";
      btn.textContent = "PEEK!";

      scene.appendChild(hint);
      scene.appendChild(ovenWrap);
      scene.appendChild(gauge);
      scene.appendChild(hitsLabel);
      scene.appendChild(btn);
      gestureStageEl.appendChild(scene);

      // color stops matching the gauge gradient, for tinting the cake sprite
      const COLOR_STOPS = [
        [0, [255, 243, 214]], [22, [255, 233, 168]], [45, [244, 194, 76]],
        [62, [217, 138, 46]], [80, [168, 83, 31]], [100, [92, 42, 20]],
      ];
      function colorAt(pct) {
        for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
          const [p0, c0] = COLOR_STOPS[i];
          const [p1, c1] = COLOR_STOPS[i + 1];
          if (pct >= p0 && pct <= p1) {
            const t = (pct - p0) / (p1 - p0);
            const r = Math.round(c0[0] + (c1[0] - c0[0]) * t);
            const g = Math.round(c0[1] + (c1[1] - c0[1]) * t);
            const b = Math.round(c0[2] + (c1[2] - c0[2]) * t);
            return `rgb(${r},${g},${b})`;
          }
        }
        return "rgb(255,243,214)";
      }

      const gaugeWidth = () => gauge.getBoundingClientRect().width || 230;
      const zoneWidth = Math.max(30, 52 - difficultyRound * 1.5);
      // golden zone sits roughly over the golden-brown part of the gradient
      const zoneCenterPct = 0.5;

      function positionZone() {
        const w = gaugeWidth();
        const left = w * zoneCenterPct - zoneWidth / 2;
        zone.style.left = left + "px";
        zone.style.width = zoneWidth + "px";
        return { left, right: left + zoneWidth };
      }
      let zoneBounds = positionZone();

      let phase = Math.random() * Math.PI * 2;
      const speed = 0.0018 + Math.min(difficultyRound * 0.00022, 0.0016);
      let lastTs = null;
      let localRaf = null;
      let needleX = gaugeWidth() / 2;

      function frame(ts) {
        if (stepResolved) return;
        if (lastTs === null) lastTs = ts;
        const dt = ts - lastTs;
        lastTs = ts;

        const w = gaugeWidth();
        phase += speed * dt;
        needleX = w / 2 + (w / 2 - 6) * Math.sin(phase);
        needle.style.left = needleX + "px";
        cakeEl.style.background = colorAt((needleX / w) * 100);

        localRaf = requestAnimationFrame(frame);
      }

      btn.addEventListener("pointerdown", () => {
        if (stepResolved) return;
        const inZone = needleX >= zoneBounds.left && needleX <= zoneBounds.right;
        btn.classList.remove("pulse", "hit-good", "hit-bad");
        void btn.offsetWidth;
        btn.classList.add("pulse", inZone ? "hit-good" : "hit-bad");
        setTimeout(() => btn.classList.remove("hit-good", "hit-bad"), 220);

        if (inZone) {
          hits++;
          hitsLabel.textContent = "GOOD BAKES: " + hits + " / " + hitsNeeded;
          setProgress((hits / hitsNeeded) * 100);
          if (hits >= hitsNeeded) resolveStep(true, false);
        }
      });

      localRaf = requestAnimationFrame(frame);
      const onResize = () => { zoneBounds = positionZone(); };
      window.addEventListener("resize", onResize);
      gauge._cleanup = () => {
        cancelAnimationFrame(localRaf);
        window.removeEventListener("resize", onResize);
      };

    } else if (gesture === "sprinkleShake") {
      requiredValue = 22 + Math.min(difficultyRound * 2, 16);
      let placed = 0;
      const SPRINKLE_COLORS = ["#FF5FA8", "#3ED598", "#FFD23F", "#FFF6E3", "#6FA8D6"];

      const wrap = document.createElement("div");
      wrap.className = "sprinkle-wrap";
      const cake = document.createElement("div");
      cake.className = "sprinkle-cake";
      wrap.appendChild(cake);
      const shaker = document.createElement("div");
      shaker.className = "shaker";
      wrap.appendChild(shaker);
      gestureStageEl.appendChild(wrap);

      const cakeRadius = 78;
      let lastPoint = null;
      let distanceSince = 0;
      let wiggleToggle = false;

      const getLocalPoint = (e) => {
        const point = e.touches ? e.touches[0] : e;
        const r = cake.getBoundingClientRect();
        return { x: point.clientX - r.left - 78, y: point.clientY - r.top - 78 }; // relative to cake center
      };

      const onDown = (e) => { dragging = true; lastPoint = null; handleMove(e); };
      const onMove = (e) => { if (dragging) handleMove(e); };
      const onUp = () => { dragging = false; };

      function handleMove(e) {
        if (stepResolved) return;
        const p = getLocalPoint(e);
        const wrapRect = wrap.getBoundingClientRect();
        const cakeRect = cake.getBoundingClientRect();
        const shakerX = (cakeRect.left - wrapRect.left) + 78 + p.x;
        const shakerY = (cakeRect.top - wrapRect.top) + 78 + p.y;
        shaker.style.left = shakerX + "px";
        shaker.style.top = shakerY + "px";
        wiggleToggle = !wiggleToggle;
        shaker.classList.toggle("wiggle-a", wiggleToggle);
        shaker.classList.toggle("wiggle-b", !wiggleToggle);

        if (lastPoint) {
          distanceSince += Math.hypot(p.x - lastPoint.x, p.y - lastPoint.y);
          while (distanceSince > 14 && placed < requiredValue) {
            distanceSince -= 14;
            const dist = Math.hypot(p.x, p.y);
            if (dist < cakeRadius - 6) {
              const dot = document.createElement("div");
              dot.className = "sprinkle-dot";
              dot.style.left = (78 + p.x + (Math.random() * 10 - 5)) + "px";
              dot.style.top = (78 + p.y + (Math.random() * 10 - 5)) + "px";
              dot.style.background = SPRINKLE_COLORS[Math.floor(Math.random() * SPRINKLE_COLORS.length)];
              dot.style.setProperty("--rot", Math.floor(Math.random() * 360) + "deg");
              cake.appendChild(dot);
              placed++;
              setProgress((placed / requiredValue) * 100);
              if (placed >= requiredValue) { resolveStep(true, false); break; }
            }
          }
        }
        lastPoint = p;
      }

      wrap.addEventListener("pointerdown", onDown);
      wrap.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      wrap._cleanup = () => window.removeEventListener("pointerup", onUp);

    } else if (gesture === "tap") {
      requiredValue = 7 + Math.min(difficultyRound, 6);
      const btn = document.createElement("button");
      btn.className = "tap-btn";
      btn.textContent = "PLACE!";
      gestureStageEl.appendChild(btn);

      btn.addEventListener("pointerdown", () => {
        if (stepResolved) return;
        tapCount++;
        btn.classList.remove("pulse");
        void btn.offsetWidth;
        btn.classList.add("pulse");
        setProgress((tapCount / requiredValue) * 100);
        if (tapCount >= requiredValue) resolveStep(true, false);
      });
    }
  }

  function resolveStep(correct, timedOut) {
    if (stepResolved) return;
    stepResolved = true;
    clearTimeout(timeTimerId);
    gestureStageEl.querySelectorAll(".circle-zone, .shake-zone, .mix-bowl, .pour-fixed-bowl, .bake-gauge, .oven-wrap, .frost-wrap")
      .forEach(el => { if (el._cleanup) el._cleanup(); });

    if (correct) {
      combo++;
      score += 10 * combo;
      feedbackEl.textContent = "NICE! +" + (10 * combo);
    } else {
      combo = 0;
      lives--;
      updateLives();
      feedbackEl.textContent = timedOut ? "TOO SLOW!" : "OOPS!";
      stageEl.classList.add("shake");
      setTimeout(() => stageEl.classList.remove("shake"), 250);
    }
    scoreEl.textContent = "SCORE " + score;

    if (lives <= 0) {
      setTimeout(gameOver, 400);
      return;
    }

    stepIndex++;
    setTimeout(showStep, 500);
  }

  function updateLives() {
    livesEl.innerHTML = "";
    for (let i = 0; i < 3; i++) {
      const span = document.createElement("span");
      span.textContent = "♥";
      if (i < lives) span.classList.add("on");
      livesEl.appendChild(span);
    }
  }

  function roundComplete() {
    document.getElementById("roundCompleteScore").textContent = "Score so far: " + score;
    document.getElementById("roundCompleteScreen").classList.add("show");
  }

  function gameOver() {
    document.getElementById("finalScore").textContent = "Final score: " + score;
    document.getElementById("gameOverScreen").classList.add("show");
  }

  document.getElementById("nextRoundBtn").addEventListener("click", () => {
    round++;
    document.getElementById("roundCompleteScreen").classList.remove("show");
    startRound();
  });

  document.getElementById("retryBtn").addEventListener("click", () => {
    round = 1; score = 0; lives = 3; combo = 0;
    updateLives();
    scoreEl.textContent = "SCORE 0";
    document.getElementById("gameOverScreen").classList.remove("show");
    startRound();
  });

  startRound();
</script>

</body>
</html>
